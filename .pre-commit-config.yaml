minimum_pre_commit_version: "4.0.0"
exclude: >
  (?x)^(
    data/
  )$

default_install_hook_types:
  - pre-commit
  - pre-push

default_language_version:
  python: python3.13

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: debug-statements
      - id: detect-private-key
        exclude: ^tests/|^.github/workflows/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        name: gitleaks (secret scanning)
        entry: python scripts/gitleaks_precommit.py
        pass_filenames: true

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: python -m mypy --config-file mypy.ini
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: eslint
        name: eslint
        entry: npx eslint . --ignore-pattern "_out/**" --ignore-pattern "dist/**" --ignore-pattern "node_modules/**" --ignore-pattern ".codex/**" --ignore-pattern ".serena/**"
        language: system
        pass_filenames: false
        stages: [pre-push]

  - repo: https://github.com/jendrikseipp/vulture
    rev: v2.14
    hooks:
      - id: vulture
        name: vulture (dead code detection)
        args: [src/, whitelist.py, "--min-confidence=60"]
        pass_filenames: false
        stages: [pre-push]
