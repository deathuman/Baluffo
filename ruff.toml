target-version = "py313"
line-length = 100

exclude = [
  ".git",
  ".github",
  ".venv",
  "__pycache__",
  "node_modules",
  "data",
  "docs",
]

[lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  "E501",
]

[lint.per-file-ignores]
"tests/**/*.py" = [
  "B011",
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false