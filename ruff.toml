target-version = "py313"
line-length = 100

exclude = [
  ".git",
  ".github",
  ".venv",
  "__pycache__",
  "node_modules",
  "data",
  "docs",
]

[lint]
select = [
  "E",
  "F",
  "I",
  "B",
  "UP",
]
ignore = [
  "E501",
  "E402",
  "E731",  # lambda assignments often intentional for callbacks
  "F811",  # redefinition of unused - often intentional re-exports
]

[lint.per-file-ignores]
"**/__init__.py" = [
  "F401",  # unused imports in __init__.py - re-exports for downstream
]
"src/admin_bridge.py" = [
  "F401",  # re-export hub - imports used by downstream consumers via module attribute
]
"whitelist.py" = [
  "B018",
  "F821",
]
"tests/**/*.py" = [
  "B011",
  "F841",  # unused variables in tests often intentional
]
"analysis_tools/**/*.py" = [
  "F841",  # unused variables in research scripts
  "F821",  # undefined name in research scripts
]
"scripts/**/*.py" = [
  "F841",  # unused variables in scripts
  "B007",  # unused loop variables in scripts
]
"src/ship/desktop_app/__init__.py" = [
  "F821",  # ROOT may be dynamically defined
]
"src/bridge/server/handler.py" = [
  "A003",  # BaseHTTPRequestHandler requires the `format` parameter name in log_message.
  "N802",  # BaseHTTPRequestHandler requires do_GET/do_POST/do_OPTIONS method names.
]
"src/ship/runtime_launcher.py" = [
  "A003",  # BaseHTTPRequestHandler requires the `format` parameter name in log_message.
  "N802",  # BaseHTTPRequestHandler requires do_GET/end_headers method names.
]
"src/ship/packaged_smoke/rehearsal_sync.py" = [
  "A003",  # BaseHTTPRequestHandler requires the `format` parameter name in log_message.
  "N802",  # BaseHTTPRequestHandler requires do_GET/do_POST method names.
]
"src/ship/packaged_smoke/rehearsal_update.py" = [
  "A003",  # BaseHTTPRequestHandler requires the `format` parameter name in log_message.
  "N802",  # BaseHTTPRequestHandler requires do_GET method names.
]
"src/source_discovery/gameprog.py" = [
  "B007",  # unused loop variable in legacy code
]
"src/jobs_fetcher.py" = [
  "F822",  # undefined in __all__ - may be added dynamically
]
"src/jobs/adapters/__init__.py" = [
  "UP035",  # typing imports in __init__ for re-export
]
"src/jobs/adapters/community/__init__.py" = [
  "UP035",  # typing imports in __init__ for re-export
]
"src/jobs/common/__init__.py" = [
  "UP035",  # typing imports in __init__ for re-export
]
"src/source_sync.py" = [
  "B905",  # zip strict parameter not available in py3.9
]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
docstring-code-format = false
