manifestVersion: 1.1
id: deathuman-baluffo
name: Baluffo
tagline: Find and save game industry jobs
icon: https://raw.githubusercontent.com/deathuman/Baluffo/main/packaging/baluffo.png
category: Development
version: "0.3.057"
port: 8877
description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Release 0.3.057 is a container rollup that includes the storage, retention,
  maintenance, and write-lock changes published as 0.3.049 through 0.3.056.
  Old job-feed generations are removed in smaller batches, so cleanup no longer
  holds the database write lock for the entire deletion. Admin's Database
  storage panel now shows the current write-lock holder and how long it has been
  held, or "No write lock held" when the database is idle. The current feed,
  saved jobs, notes, and compatibility exports are preserved.
storage:
  dataRoot: data
