manifestVersion: 1.1
id: deathuman-baluffo
name: Baluffo
tagline: Find and save game industry jobs
icon: https://raw.githubusercontent.com/deathuman/Baluffo/main/packaging/baluffo.png
category: Development
version: "0.3.062"
port: 8877
description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Release 0.3.062 makes deleting the retained pre-rebuild database safer: it
  requires explicit confirmation, checks the reviewed backup size, and verifies
  the live feed before freeing space. If a newer feed has replaced the completed
  rebuild, the current feed is checked instead. Existing feeds, saved jobs,
  notes, and compatibility exports are preserved; rollback remains available
  until you confirm deletion.
storage:
  dataRoot: data
