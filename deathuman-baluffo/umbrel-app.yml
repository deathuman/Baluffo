description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Release 0.3.058 reduces write-lock contention during storage maintenance.
  Job-feed retention now removes source rows in fixed 250-row batches, so one
  job with many sources cannot make a cleanup transaction run long. Background
  PASSIVE WAL checkpoints now wait 60 seconds between attempts while the
  journal is at its 64 MiB limit; crossing 256 MiB still schedules an immediate
  truncate. Storage health now reports checkpoint wait and hold timings, and
  Quick check keeps partial measurements instead of presenting incomplete
  samples as exact. The current feed, saved jobs, notes, and compatibility
  exports are preserved.
storage:
  dataRoot: data
