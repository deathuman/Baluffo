releaseNotes: >-
  The Jobs page now keeps a successful browser-rendered page instead of falling
  back to the original static shell, so dynamic sources can return their jobs.
  The container startup check now matches the full-feed-first Jobs page, so
  release validation no longer reports a false failure. Existing jobs, saved jobs
  and notes are kept.
storage:
  dataRoot: data
