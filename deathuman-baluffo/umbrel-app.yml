manifestVersion: 1.1
id: deathuman-baluffo
name: Baluffo
tagline: Find and save game industry jobs
icon: https://raw.githubusercontent.com/deathuman/Baluffo/main/packaging/baluffo.png
category: Development
version: "0.3.038"
port: 8877
description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
