releaseNotes: >-
  Release 0.3.054 keeps the bounded current-versus-older row-byte estimate
  working on the large runtime database and adds post-serve cleanup of old
  saved jobs-feed generations. Admin's storage panel is clearer and includes
  a Run maintenance action for the cleanup. The current feed, saved jobs,
  notes, and compatibility exports are preserved; old feed generations are
  removed in bounded batches and the database is compacted afterward.
