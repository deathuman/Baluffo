manifestVersion: 1.1
id: deathuman-baluffo
name: Baluffo
tagline: Find and save game industry jobs
icon: https://raw.githubusercontent.com/deathuman/Baluffo/main/packaging/baluffo.png
category: Development
version: "0.3.036"
port: 8877
description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  The Jobs page now opens the full feed directly and shows a loading state,
  using the last saved snapshot only if the full feed cannot load. The Admin
  action center now separates zero-job sources from sources needing browser
  fallback. Source sync retries GitHub rate-limit and server errors, and Workable
  board detection no longer mistakes a machine-readable help file for an account.
  Existing jobs, saved jobs and notes are kept.
storage:
  dataRoot: data
