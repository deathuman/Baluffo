manifestVersion: 1.1
id: deathuman-baluffo
name: Baluffo
tagline: Find and save game industry jobs
icon: https://raw.githubusercontent.com/deathuman/Baluffo/main/packaging/baluffo.png
category: Development
version: "0.3.042"
port: 8877
description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Jobs diagnostics now show browser-fallback health, fetch-source failures, and
  static deadline cuts in Admin and Ops. Static fetches honor one shared deadline
  across retries and redirects, the Jobs cache repairs its schema without losing
  seen-job history, and closing the desktop window now completes cleanup within
  the packaged target. Existing jobs, saved jobs and notes are kept.
storage:
  dataRoot: data
