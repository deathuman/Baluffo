description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Release 0.3.063 makes the one-time delete of the retained pre-rebuild database
  a background storage-rebuild job. Admin starts the delete, can leave the page
  open, and polls the existing storage-rebuild status while the old file is
  validated and freed; a duplicate start reuses the active run. Validation
  failure keeps the rollback copy. Existing feeds, saved jobs, notes, and
  compatibility exports are preserved; rollback remains available until you
  confirm deletion. If an earlier delete already removed the file but lost its
  response, the bridge records that completed deletion without touching the live
  database or any other file.
storage:
  dataRoot: data
