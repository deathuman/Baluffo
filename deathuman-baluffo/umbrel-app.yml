manifestVersion: 1.1
id: deathuman-baluffo
name: Baluffo
tagline: Find and save game industry jobs
icon: https://raw.githubusercontent.com/deathuman/Baluffo/main/packaging/baluffo.png
category: Development
version: "0.3.061"
port: 8877
description: >-
  Discover game industry jobs from studios worldwide. Filter openings, save jobs,
  and keep notes and reminders in one place.
developer: Deathuman
website: https://github.com/deathuman/Baluffo
dependencies: []
repo: https://github.com/deathuman/Baluffo
support: https://github.com/deathuman/Baluffo/issues
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  Release 0.3.061 adds a one-action current-feed rebuild for oversized runtime
  databases, a read-only cleanup preview, and safe stop controls for feed
  cleanup. Fetch finalization now keeps the current saved version when a run
  finds no meaningful job changes, and storage diagnostics report compaction
  sizing and per-transaction timing. Existing feeds, saved jobs, notes, and
  compatibility exports are preserved; the previous database remains available
  for rollback until you delete it.
storage:
  dataRoot: data
