releaseNotes: >-
  Release 0.3.051 adds a Quick check to the Admin Runtime Database Storage
  panel. It counts job and source rows by feed generation without walking
  every database page, so a runaway runtime database can be identified in
  seconds or minutes instead of hours. The exact diagnostic remains available
  when table and index allocation is needed. Existing data and cleanup are
  unchanged.
