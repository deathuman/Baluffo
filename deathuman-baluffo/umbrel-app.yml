releaseNotes: >-
  The Ops tab no longer re-reads the task history twice per poll, so it stays
  responsive with a long task ledger. Registry conflicts refresh faster and show
  which job evidence they used, and the Jobs page rebuilds its startup snapshot
  without parsing the whole feed. Existing jobs, saved jobs and notes are kept.
storage:
  dataRoot: data
