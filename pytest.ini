[pytest]
testpaths = tests
cache_dir = .tmp/pytest/cache
addopts = -p no:cacheprovider
markers =
    slow: long-running tests (exclude from quick local runs)
    integration: tests that exercise multi-component flows or boundary-heavy behavior
    packaging: tests that validate packaging, bundle assembly, or packaged runtime behavior
    release: tests that validate release-only workflows or repeatability checks
