name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-cov pytest-xdist

      - name: Run Python tests with coverage
        run: python -m pytest tests -q -m "not slow" --cov=src --cov-report=term-missing --color=no

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Admin Bridge
        run: npm run dev:bridge &
        shell: bash

      - name: Wait for services
        run: sleep 15

      - name: Verify bridge is running
        run: curl -s http://127.0.0.1:8877/health || echo "Bridge not ready yet, continuing..."

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend smoke tests
        run: npm run test:smoke