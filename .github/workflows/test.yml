name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install pytest pytest-cov pytest-xdist

      - name: Run Python tests with coverage
        run: python -m pytest tests -q -m "not slow" --cov=src --cov-report=term-missing --color=no

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25.8.0"
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Admin Bridge
        run: npm run dev:bridge &
        shell: bash

      - name: Wait for bridge readiness
        shell: bash
        run: |
          delay=1
          for attempt in {1..7}; do
            if curl -fsS http://127.0.0.1:8877/ops/health \
              | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('service') == 'baluffo-bridge' and d.get('startupReady') is True else 1)" \
              && curl -fsS http://127.0.0.1:8877/ops/fetcher-metrics \
              | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('latestRun',{}).get('failedSources') is not None else 1)"; then
              echo "Bridge is ready"
              exit 0
            fi
            if [ "$attempt" -eq 7 ]; then
              echo "Bridge did not become ready"
              exit 1
            fi
            echo "Waiting for bridge... attempt $attempt"
            sleep "$delay"
            if [ "$delay" -lt 16 ]; then
              delay=$((delay * 2))
            fi
          done

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend smoke tests
        run: npm run test:smoke
