name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install pytest pytest-cov pytest-xdist

      - name: Run Python tests with coverage
        run: python -m pytest tests -q -m "not slow" --cov=src --cov-report=term-missing --color=no

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: python -m pip install -r requirements-lock.txt

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Start Admin Bridge
        run: npm run dev:bridge &
        shell: bash

      - name: Wait for services
        run: sleep 15

      - name: Verify bridge is running
        run: |
          for i in {1..6}; do
            if curl -s http://127.0.0.1:8877/ops/fetcher-metrics | python3 -c "import sys,json; d=json.load(sys.stdin); sys.exit(0 if d.get('latestRun',{}).get('failedSources') is not None else 1)"; then
              echo "Bridge is ready"
              break
            fi
            echo "Waiting for bridge... attempt $i"
            sleep 5
          done

      - name: Run frontend unit tests
        run: npm run test:unit

      - name: Run frontend smoke tests
        run: npm run test:smoke
