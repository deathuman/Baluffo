name: build-portable-exe

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Bundle version override
        required: false
        default: ""
      release_tag:
        description: Existing release tag to publish or refresh
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows-portable:
    runs-on: windows-latest
    env:
      BALUFFO_SYNC_BUILD_APP_ID: ${{ secrets.BALUFFO_SYNC_BUILD_APP_ID }}
      BALUFFO_SYNC_BUILD_INSTALLATION_ID: ${{ secrets.BALUFFO_SYNC_BUILD_INSTALLATION_ID }}
      BALUFFO_SYNC_BUILD_REPO: ${{ secrets.BALUFFO_SYNC_BUILD_REPO }}
      BALUFFO_SYNC_BUILD_PRIVATE_KEY_PEM: ${{ secrets.BALUFFO_SYNC_BUILD_PRIVATE_KEY_PEM }}
      BALUFFO_DESKTOP_UPDATE_KEY_ID: ${{ secrets.BALUFFO_DESKTOP_UPDATE_KEY_ID }}
      BALUFFO_DESKTOP_UPDATE_PRIVATE_KEY_B64: ${{ secrets.BALUFFO_DESKTOP_UPDATE_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Python desktop dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt pytest

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Resolve bundle version
        shell: pwsh
        run: |
          $version = "${{ inputs.bundle_version }}"
          $releaseTag = "${{ inputs.release_tag }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
              $version = $releaseTag.TrimStart("v")
            } elseif ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}".TrimStart("v")
            } else {
              $version = "0.0.0-ci.${{ github.run_number }}"
            }
          }
          "BALUFFO_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (-not [string]::IsNullOrWhiteSpace($releaseTag)) {
            "BALUFFO_RELEASE_TAG=$releaseTag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            "BALUFFO_RELEASE_TAG=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Check tagged build secrets
        shell: pwsh
        run: |
          $releaseTag = "${{ inputs.release_tag }}"
          $isReleaseBuild = ("${{ github.ref_type }}" -eq "tag") -or -not [string]::IsNullOrWhiteSpace($releaseTag)
          if ($isReleaseBuild) {
            if ([string]::IsNullOrWhiteSpace($env:BALUFFO_SYNC_BUILD_PRIVATE_KEY_PEM)) {
              throw "Missing BALUFFO_SYNC_BUILD_PRIVATE_KEY_PEM secret for tagged release build."
            }
          }

      - name: Prepare desktop update signing inputs
        shell: pwsh
        run: |
          $keyId = "$env:BALUFFO_DESKTOP_UPDATE_KEY_ID"
          $privateKeyB64 = "$env:BALUFFO_DESKTOP_UPDATE_PRIVATE_KEY_B64"
          $releaseTag = "${{ inputs.release_tag }}"
          $isReleaseBuild = ("${{ github.ref_type }}" -eq "tag") -or -not [string]::IsNullOrWhiteSpace($releaseTag)

          if ($isReleaseBuild) {
            if ([string]::IsNullOrWhiteSpace($keyId) -or [string]::IsNullOrWhiteSpace($privateKeyB64)) {
              throw "Missing desktop update signing secrets for tagged release build."
            }
          } elseif ([string]::IsNullOrWhiteSpace($keyId) -or [string]::IsNullOrWhiteSpace($privateKeyB64)) {
            $generated = python -c "import base64, json; from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey; key = Ed25519PrivateKey.generate(); key_id = 'desktop-ed25519-ci'; print(json.dumps({'keyId': key_id, 'privateKeyB64': base64.b64encode(key.private_bytes_raw()).decode('ascii'), 'publicKeysJson': json.dumps({key_id: base64.b64encode(key.public_key().public_bytes_raw()).decode('ascii')})}))"
            $payload = $generated | ConvertFrom-Json
            $keyId = $payload.keyId
            $privateKeyB64 = $payload.privateKeyB64
          }

          "BALUFFO_DESKTOP_UPDATE_KEY_ID=$keyId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BALUFFO_DESKTOP_UPDATE_PRIVATE_KEY_B64=$privateKeyB64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $publicKeysPath = Join-Path $env:GITHUB_WORKSPACE "packaging/desktop-update-public-keys.json"
          if (-not (Test-Path $publicKeysPath -PathType Leaf)) {
            throw "Missing packaging/desktop-update-public-keys.json in the checked-out repository."
          }
          "BALUFFO_DESKTOP_UPDATE_PUBLIC_KEYS_PATH=$publicKeysPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prepare packaged sync config build inputs
        shell: pwsh
        run: |
          $appId = "$env:BALUFFO_SYNC_BUILD_APP_ID"
          $installId = "$env:BALUFFO_SYNC_BUILD_INSTALLATION_ID"
          $repo = "$env:BALUFFO_SYNC_BUILD_REPO"
          $privateKeyPem = "$env:BALUFFO_SYNC_BUILD_PRIVATE_KEY_PEM"

          if ([string]::IsNullOrWhiteSpace($appId)) { $appId = "100000" }
          if ([string]::IsNullOrWhiteSpace($installId)) { $installId = "100000" }
          if ([string]::IsNullOrWhiteSpace($repo)) { $repo = "${{ github.repository }}" }

          $releaseTag = "${{ inputs.release_tag }}"
          $isReleaseBuild = ("${{ github.ref_type }}" -eq "tag") -or -not [string]::IsNullOrWhiteSpace($releaseTag)
          if ($isReleaseBuild -and [string]::IsNullOrWhiteSpace($privateKeyPem)) {
            throw "Missing BALUFFO_SYNC_BUILD_PRIVATE_KEY_PEM secret for tagged release build."
          }

          $keyPath = Join-Path $env:RUNNER_TEMP "baluffo-sync-app-private-key.pem"
          if ([string]::IsNullOrWhiteSpace($privateKeyPem)) {
            $placeholderPem = @(
              '-----BEGIN PRIVATE KEY-----',
              'QkFMVUZGTy1DSS1QTEFDRUhPTERFUg==',
              '-----END PRIVATE KEY-----'
            ) -join [Environment]::NewLine
            $placeholderPem | Set-Content -Path $keyPath -Encoding utf8
          } else {
            if ($privateKeyPem.Contains('\n') -and -not $privateKeyPem.Contains("`n")) {
              $privateKeyPem = $privateKeyPem.Replace('\n', "`n")
            }
            $privateKeyPem | Set-Content -Path $keyPath -Encoding utf8
          }

          "BALUFFO_SYNC_BUILD_APP_ID=$appId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BALUFFO_SYNC_BUILD_INSTALLATION_ID=$installId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BALUFFO_SYNC_BUILD_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BALUFFO_SYNC_BUILD_PRIVATE_KEY_PATH=$keyPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sync test manifest
        run: npm run sync:test-manifest

      - name: Run release gates
        id: release_gates
        run: |
          npm run test:frontend:unit
          npm run test:py:extended
          npm run test:frontend:packaged
          npm run test:frontend:packaged:sync-rehearsal
          npm run test:frontend:packaged:update-rehearsal
          npm run test:frontend:packaged:orphan-reclaim-rehearsal
          npm run test:frontend:packaged:browser-job-rehearsal
          npm run test:frontend:packaged:jobs-pipeline

      - name: Upload smoke test artifacts on failure
        if: failure() && steps.release_gates.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-artifacts-${{ github.run_number }}
          path: |
            .tmp/packaged-desktop-smoke
            data/packaged-desktop-smoke-report.json
          retention-days: 7

      - name: Build portable executable
        run: python scripts/build_portable_exe.py --bundle-version ${{ env.BALUFFO_VERSION }}

      - name: Build ship bundle
        run: python scripts/build_ship_bundle.py --bundle-version ${{ env.BALUFFO_VERSION }}

      - name: Create ship bundle zip
        shell: pwsh
        run: |
          $shipZip = "dist/baluffo-ship-${{ env.BALUFFO_VERSION }}.zip"
          if (Test-Path $shipZip) {
            Remove-Item $shipZip -Force
          }
          Compress-Archive -Path dist/baluffo-ship -DestinationPath $shipZip -Force

      - name: Extract release notes
        shell: pwsh
        run: |
          python scripts/extract_release_notes.py --version ${{ env.BALUFFO_VERSION }} --changelog docs/CHANGELOG.md --output release-notes.md

      - name: Build desktop update manifest
        shell: pwsh
        run: |
          python scripts/build_desktop_update_release.py --version ${{ env.BALUFFO_VERSION }} --github-repo ${{ github.repository }} --key-id ${{ env.BALUFFO_DESKTOP_UPDATE_KEY_ID }}

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: baluffo-portable-${{ env.BALUFFO_VERSION }}
          path: dist/baluffo-portable-${{ env.BALUFFO_VERSION }}.zip

      - name: Upload ship artifact
        uses: actions/upload-artifact@v4
        with:
          name: baluffo-ship-${{ env.BALUFFO_VERSION }}
          path: dist/baluffo-ship-${{ env.BALUFFO_VERSION }}.zip

      - name: Upload desktop update manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: baluffo-desktop-update-manifest-${{ env.BALUFFO_VERSION }}
          path: dist/baluffo-desktop-update-manifest.json

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v2.6.1
        with:
          tag_name: ${{ env.BALUFFO_RELEASE_TAG }}
          name: Baluffo ${{ env.BALUFFO_RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            dist/baluffo-portable-${{ env.BALUFFO_VERSION }}.zip
            dist/baluffo-ship-${{ env.BALUFFO_VERSION }}.zip
            dist/baluffo-desktop-update-manifest.json
