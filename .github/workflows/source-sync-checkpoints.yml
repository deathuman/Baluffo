name: source-sync-checkpoints

on:
  workflow_run:
    workflows:
      - validate-source-sync
    types:
      - completed

permissions:
  contents: write

jobs:
  publish-checkpoints:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish checkpoint tags
        env:
          VALIDATED_COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: >
          python scripts/publish_source_sync_checkpoint_tags.py
          --branch-name main
          --validation-conclusion success
          --commit-sha "$VALIDATED_COMMIT_SHA"
