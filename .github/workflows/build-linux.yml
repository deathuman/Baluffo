name: build-linux

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Bundle version override
        required: false
        default: ""
      release_tag:
        description: Existing release tag to publish
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    env:
      # The Linux channel signs its own manifest: it names the AppImage, so it is
      # built after that artifact exists instead of coordinating with the
      # Windows workflow over one shared file.
      BALUFFO_DESKTOP_UPDATE_KEY_ID: ${{ secrets.BALUFFO_DESKTOP_UPDATE_KEY_ID }}
      BALUFFO_DESKTOP_UPDATE_PRIVATE_KEY_B64: ${{ secrets.BALUFFO_DESKTOP_UPDATE_PRIVATE_KEY_B64 }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "25.8.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser curl libfuse2 xvfb

      - name: Install Python dependencies
        # pytest-xdist is not in the lockfile and this lane runs the suite (not only the
        # AppImage build), so a test that shards a child session needs it here too. Keep the
        # line equal to the other suite-running lanes: tests in test_xdist_assignment.py
        # cannot collect under `-n` without it.
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt pytest pytest-xdist

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve bundle version
        run: |
          version="${{ inputs.bundle_version }}"
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$version" ]; then
            if [ -n "$release_tag" ]; then
              version="${release_tag#v}"
            elif [ "${{ github.ref_type }}" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="0.0.0-ci.${{ github.run_number }}"
            fi
          fi
          echo "BALUFFO_VERSION=$version" >> "$GITHUB_ENV"
          if [ -n "$release_tag" ]; then
            echo "BALUFFO_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "BALUFFO_RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Check tagged build secrets
        run: |
          release_tag="${{ inputs.release_tag }}"
          is_release="${{ github.ref_type == 'tag' || inputs.release_tag != '' }}"
          if [ "$is_release" = "true" ]; then
            echo "Release build - checking secrets..."
          else
            echo "CI build - skipping secret checks"
          fi

      - name: Lint
        run: npm run lint:py

      - name: Typecheck
        run: npm run typecheck:py

      - name: Run Linux Python tests
        run: npm run test:py:linux

      - name: Build Linux AppImage
        run: npm run build:linux -- --bundle-version "${{ env.BALUFFO_VERSION }}"

      - name: Build desktop update manifest (Linux)
        run: |
          python scripts/build_desktop_update_release.py \
            --version "${{ env.BALUFFO_VERSION }}" \
            --artifact "dist/Baluffo-${BALUFFO_VERSION}-x86_64.AppImage" \
            --artifact-kind appimage \
            --github-repo "${{ github.repository }}"

      - name: Smoke test AppImage
        run: PLAYWRIGHT_SYSTEM_CHROMIUM=1 PACKAGED_SMOKE_SYSTEM_CHROMIUM=1 bash scripts/smoke_test_appimage.sh

      # The Linux launcher cannot enumerate windows, so this lane reports the
      # page's own click-to-interactive clock and an *inferred* window mark
      # (the launcher's reveal timeout), never an observed paint. The report is
      # advisory: it is uploaded for review but does not block a release, because
      # no Linux baseline exists yet and a runner without a display or a browser
      # would otherwise turn a measurement into a publishing failure.
      - name: Install Playwright Chromium for the startup measurement
        run: python -m playwright install --with-deps chromium

      - name: Record AppImage startup figures
        continue-on-error: true
        run: |
          set -euo pipefail
          chrome="$(python -c "from playwright.sync_api import sync_playwright; pw = sync_playwright().start(); print(pw.chromium.executable_path); pw.stop()")"
          xvfb-run -a env \
            BALUFFO_DESKTOP_BROWSER_PATH="$chrome" \
            BALUFFO_PACKAGED_SMOKE_RUNTIME=1 \
            python tools/measurements/desktop/spawn_startup.py \
              --exe "dist/Baluffo-${BALUFFO_VERSION}-x86_64.AppImage" \
              --runs 1 --modes cold --probe \
              --output-dir .tmp/spawn-startup-appimage

      - name: Upload AppImage startup report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: spawn-startup-appimage-${{ env.BALUFFO_VERSION }}
          path: .tmp/spawn-startup-appimage/spawn-startup.*
          retention-days: 30
          if-no-files-found: ignore

      # A real N -> N+1 self-update. The second build differs only in its bundle
      # version, which makes its bytes distinguishable from the release artifact;
      # the running version is lowered through the app's version override, so the
      # manifest names the real version and the helper must clear that override
      # when it relaunches. Built after the smoke and startup runs so neither
      # picks it up by version sort.
      - name: Rehearse AppImage self-update
        run: |
          set -euo pipefail
          npm run build:linux -- --bundle-version "${BALUFFO_VERSION}-rehearsal-target"
          BALUFFO_UPDATE_APPIMAGE_BEFORE="dist/Baluffo-${BALUFFO_VERSION}-x86_64.AppImage" \
          BALUFFO_UPDATE_APPIMAGE_AFTER="dist/Baluffo-${BALUFFO_VERSION}-rehearsal-target-x86_64.AppImage" \
          BALUFFO_UPDATE_TARGET_VERSION="${BALUFFO_VERSION}" \
          BALUFFO_UPDATE_BEFORE_VERSION="0.0.9" \
            npm run test:frontend:packaged:update-rehearsal:appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: Baluffo-${{ env.BALUFFO_VERSION }}-x86_64.AppImage
          path: dist/Baluffo-${{ env.BALUFFO_VERSION }}-x86_64.AppImage
          retention-days: 30

      - name: Upload desktop update manifest artifact
        uses: actions/upload-artifact@v7
        with:
          name: baluffo-desktop-update-manifest-linux-${{ env.BALUFFO_VERSION }}
          path: dist/baluffo-desktop-update-manifest-linux.json
          retention-days: 30

      # Publish the notes from the changelog, not from the tag message. This
      # workflow usually finishes before build-portable-exe, so whichever one runs
      # first creates the release. Without a body_path the release shipped with an
      # empty body and rendered the tag annotation until the Windows workflow
      # updated it -- and had that workflow failed, it would have shipped with no
      # notes at all and nothing would have noticed. Extracting here rather than
      # reading the tracked release-notes.md means the notes can never be stale.
      - name: Extract release notes
        run: |
          python scripts/extract_release_notes.py --version ${{ env.BALUFFO_VERSION }} --changelog docs/CHANGELOG.md --output release-notes.md

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BALUFFO_RELEASE_TAG }}
          name: Baluffo ${{ env.BALUFFO_RELEASE_TAG }}
          body_path: release-notes.md
          files: |
            dist/Baluffo-${{ env.BALUFFO_VERSION }}-x86_64.AppImage
            dist/baluffo-desktop-update-manifest-linux.json
