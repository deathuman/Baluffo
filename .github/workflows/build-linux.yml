name: build-linux

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: Bundle version override
        required: false
        default: ""
      release_tag:
        description: Existing release tag to publish
        required: false
        default: ""
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' && inputs.release_tag || github.ref }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v6
        with:
          node-version: "25.8.0"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser curl libfuse2

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-lock.txt pytest

      - name: Install Node dependencies
        run: npm ci

      - name: Resolve bundle version
        run: |
          version="${{ inputs.bundle_version }}"
          release_tag="${{ inputs.release_tag }}"
          if [ -z "$version" ]; then
            if [ -n "$release_tag" ]; then
              version="${release_tag#v}"
            elif [ "${{ github.ref_type }}" = "tag" ]; then
              version="${GITHUB_REF_NAME#v}"
            else
              version="0.0.0-ci.${{ github.run_number }}"
            fi
          fi
          echo "BALUFFO_VERSION=$version" >> "$GITHUB_ENV"
          if [ -n "$release_tag" ]; then
            echo "BALUFFO_RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "BALUFFO_RELEASE_TAG=${{ github.ref_name }}" >> "$GITHUB_ENV"
          fi

      - name: Check tagged build secrets
        run: |
          release_tag="${{ inputs.release_tag }}"
          is_release="${{ github.ref_type == 'tag' || inputs.release_tag != '' }}"
          if [ "$is_release" = "true" ]; then
            echo "Release build - checking secrets..."
          else
            echo "CI build - skipping secret checks"
          fi

      - name: Lint
        run: npm run lint:py

      - name: Typecheck
        run: npm run typecheck:py 2>/dev/null || echo "Typecheck skipped (not configured)"

      - name: Run Linux Python tests
        run: npm run test:py:linux

      - name: Build Linux AppImage
        run: npm run build:linux -- --bundle-version "${{ env.BALUFFO_VERSION }}"

      - name: Smoke test AppImage
        run: PLAYWRIGHT_SYSTEM_CHROMIUM=1 PACKAGED_SMOKE_SYSTEM_CHROMIUM=1 bash scripts/smoke_test_appimage.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: Baluffo-${{ env.BALUFFO_VERSION }}-x86_64.AppImage
          path: dist/Baluffo-${{ env.BALUFFO_VERSION }}-x86_64.AppImage
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.BALUFFO_RELEASE_TAG }}
          name: Baluffo ${{ env.BALUFFO_RELEASE_TAG }}
          files: dist/Baluffo-${{ env.BALUFFO_VERSION }}-x86_64.AppImage
