[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
follow_imports = silent
strict_optional = True
warn_unused_ignores = True
files = src/python_version_guard.py, src/pipeline_io.py, src/bridge/report_normalizer.py, src/bridge/api.py, src/bridge/admin_registry_api.py, src/bridge/admin_task_runtime.py, src/bridge/ops_live_payload.py
