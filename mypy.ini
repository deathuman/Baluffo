[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
ignore_missing_imports = True
strict_optional = True
warn_unused_ignores = True
files = src/python_version_guard.py, src/pipeline_io.py

[mypy-tests.*]
ignore_errors = True

[mypy-src.scrapers.*]
ignore_errors = True
