<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baluffo System Map</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/components.css">
  <style>
    .map-container { max-width: 900px; margin: 0 auto; padding: 1rem; }
    .map-section { background: var(--surface-2); border: 1px solid var(--surface-8); border-radius: 8px; padding: 1rem; margin-bottom: 0.85rem; }
    .map-section h2 { font-size: 1.2rem; margin: 0 0 0.6rem; color: var(--text-primary); border-bottom: 1px solid var(--border-default); padding-bottom: 0.4rem; }
    .map-section h3 { font-size: 1rem; margin: 0.6rem 0 0.4rem; color: var(--text-primary); }
    .map-card { background: var(--surface-5); border: 1px solid var(--border-default); border-radius: 6px; padding: 0.6rem 0.75rem; margin-bottom: 0.4rem; }
    .map-card-title { font-weight: 600; color: var(--text-primary); margin-bottom: 0.2rem; }
    .map-card-desc { font-size: 0.82rem; color: var(--text-subtle); margin-bottom: 0.3rem; }
    .map-card-path { font-size: 0.75rem; font-family: monospace; color: var(--accent); }
    .map-badge { display: inline-block; padding: 0.1rem 0.4rem; border-radius: 4px; font-size: 0.72rem; font-weight: 600; margin-right: 0.25rem; }
    .map-badge-risk-compatibility { background: rgba(210,153,34,0.15); color: #d29922; }
    .map-badge-risk-release { background: rgba(248,81,73,0.15); color: #f85149; }
    .map-badge-risk-contracts { background: rgba(86,211,100,0.15); color: #56d364; }
    .map-badge-risk-internal { background: rgba(139,148,158,0.2); color: #8b949e; }
    .map-breadcrumbs { font-size: 0.82rem; color: var(--text-subtle); margin-bottom: 1rem; padding: 0.4rem 0.6rem; background: var(--surface-5); border-radius: 6px; }
    .map-breadcrumbs a { color: var(--accent); text-decoration: none; }
    .map-breadcrumbs span { color: var(--text-subtle); margin: 0 0.3rem; }
    .map-step-list { font-size: 0.82rem; color: var(--text-subtle); padding-left: 1.2rem; }
    .map-step-list li { margin-bottom: 0.2rem; }
    .map-route-line { font-size: 0.82rem; font-family: monospace; color: var(--text-primary); margin-bottom: 0.15rem; }
    .map-call-list { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.3rem; }
    .map-call-chip { font-size: 0.72rem; padding: 0.1rem 0.35rem; background: var(--surface-7); border-radius: 4px; color: var(--text-subtle); font-family: monospace; white-space: nowrap; }
    .map-generated { font-size: 0.72rem; color: var(--text-subtle); text-align: right; margin-top: 1rem; }
    .map-risk-marker { padding: 0.35rem 0; border-left: 3px solid transparent; padding-left: 0.5rem; margin-bottom: 0.3rem; }
    .map-risk-marker.compatibility { border-left-color: #d29922; }
    .map-risk-marker.release { border-left-color: #f85149; }
    .map-risk-marker.contracts { border-left-color: #56d364; }
    .map-risk-marker.internal { border-left-color: #8b949e; }
    .map-risk-label { font-weight: 600; font-size: 0.85rem; }
    .map-risk-note { font-size: 0.78rem; color: var(--text-subtle); }
  </style>
</head>
<body>
  <div class="map-container">
    <h1>Baluffo System Map</h1>
    <div class="map-breadcrumbs">
      <a href="admin.html">Admin</a> <span>›</span> System Map
    </div>

    <section class="map-section" id="pages">
      <h2>Frontend Pages &amp; Bridge Surfaces</h2>
      <div id="map-pages"><div class="map-card"><em>Loading system map data&hellip;</em></div></div>
    </section>

    <section class="map-section" id="flows">
      <h2>Task Flows</h2>
      <div id="map-flows"></div>
    </section>

    <section class="map-section" id="evidence">
      <h2>Evidence Files &amp; Runtime Storage</h2>
      <div id="map-files"></div>
    </section>

    <section class="map-section" id="risks">
      <h2>Risk Markers</h2>
      <div id="map-risks"></div>
    </section>

    <div class="map-generated" id="map-generated"></div>
  </div>

  <script>
    function e(s) { const d = document.createElement("div"); d.textContent = String(s || ""); return d.innerHTML; }

    async function load() {
      try {
        const res = await fetch("data/system-map.json");
        if (!res.ok) {
          document.getElementById("map-pages").innerHTML = "<div class=\"map-card\">System map data not yet generated. Run <code>python tools/repo_health/generate_system_map.py</code>.</div>";
          return;
        }
        const data = await res.json();

        if (data.generatedAt) {
          document.getElementById("map-generated").textContent = "Generated " + new Date(data.generatedAt).toLocaleString();
        }

        renderPages(data);
        renderFlows(data);
        renderFiles(data);
        renderRisks(data);
      } catch {
        document.getElementById("map-pages").innerHTML = "<div class=\"map-card\">System map data not available.</div>";
      }
    }

    function renderPages(data) {
      const pages = Array.isArray(data.frontendPages) ? data.frontendPages : [];
      let html = "";
      for (const page of pages) {
        html += "<div class=\"map-card\">";
        html += "<div class=\"map-card-title\">" + e(page.name) + " <span class=\"map-card-path\">" + e(page.path) + "</span></div>";
        html += "<div class=\"map-card-desc\">" + e(page.description) + "</div>";
        if (Array.isArray(page.bridge_calls) && page.bridge_calls.length > 0) {
          html += "<div class=\"map-call-list\">";
          for (const call of page.bridge_calls) {
            html += "<span class=\"map-call-chip\">" + e(call) + "</span>";
          }
          html += "</div>";
        }
        html += "</div>";
      }
      document.getElementById("map-pages").innerHTML = html;
    }

    function renderFlows(data) {
      const flows = Array.isArray(data.taskFlows) ? data.taskFlows : [];
      let html = "";
      for (const flow of flows) {
        html += "<div class=\"map-card\">";
        html += "<div class=\"map-card-title\">" + e(flow.name) + "</div>";
        if (flow.entry) {
          html += "<div class=\"map-card-desc\"><strong>Entry:</strong> <span style=\"font-family:monospace\">" + e(flow.entry) + "</span></div>";
        }
        if (flow.description) {
          html += "<div class=\"map-card-desc\">" + e(flow.description) + "</div>";
        }
        if (Array.isArray(flow.steps) && flow.steps.length > 0) {
          html += "<ol class=\"map-step-list\">";
          for (const step of flow.steps) {
            html += "<li>" + e(step) + "</li>";
          }
          html += "</ol>";
        }
        html += "</div>";
      }
      document.getElementById("map-flows").innerHTML = html;
    }

    function renderFiles(data) {
      const files = Array.isArray(data.evidenceFiles) ? data.evidenceFiles : [];
      let html = "";
      for (const file of files) {
        html += "<div class=\"map-card\">";
        html += "<div class=\"map-card-title\"><span style=\"font-family:monospace\">" + e(file.name) + "</span></div>";
        html += "<div class=\"map-card-desc\">" + e(file.role) + "</div>";
        html += "</div>";
      }
      document.getElementById("map-files").innerHTML = html;
    }

    function renderRisks(data) {
      const markers = Array.isArray(data.riskMarkers) ? data.riskMarkers : [];
      let html = "";
      for (const m of markers) {
        const riskClass = String(m.risk || "internal").toLowerCase();
        html += "<div class=\"map-risk-marker " + riskClass + "\">";
        html += "<div class=\"map-risk-label\">" + e(m.label) + " <span class=\"map-badge map-badge-risk-" + riskClass + "\">" + e(m.risk) + "</span></div>";
        html += "<div class=\"map-card-path\" style=\"margin-bottom:0.1rem\">" + e(m.path) + "</div>";
        html += "<div class=\"map-risk-note\">" + e(m.note) + "</div>";
        html += "</div>";
      }
      document.getElementById("map-risks").innerHTML = html;
    }

    load();
  </script>
</body>
</html>
